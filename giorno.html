<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eventi del giorno a Reggio Emilia e provincia - Fômm Quell">
  <title>Eventi del Giorno | Fômm Quell</title>
  <link rel="icon" href="assets/Images/FQ_icona.ico" type="image/x-icon">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=2.6">
  
  <style>
    .day-view-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    
    .day-switcher-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      border: var(--border-width) solid var(--color-cream);
      background-color: var(--color-card-bg);
      box-shadow: 4px 4px 0px var(--color-cream);
      border-radius: var(--border-radius);
      padding: 1rem 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    body.light-theme .day-switcher-header {
      border-color: var(--color-dark);
      box-shadow: 4px 4px 0px var(--color-dark);
    }
    
    .day-nav-btn {
      background: transparent;
      color: var(--color-pink);
      border: none;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      padding: 0.5rem 1rem;
      transition: all 0.1s ease;
      letter-spacing: 1px;
    }
    
    .day-nav-btn:hover {
      background-color: var(--color-cream);
      color: var(--color-dark);
    }
    
    body.light-theme .day-nav-btn:hover {
      background-color: var(--color-dark);
      color: var(--color-cream);
    }
    
    .day-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.6rem;
      text-transform: uppercase;
      color: var(--color-cream);
      margin: 0;
      letter-spacing: 1px;
      text-align: center;
    }
    
    body.light-theme .day-title {
      color: var(--color-dark);
    }
    
    .day-events-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin-bottom: 4rem;
    }
    
    .detail-card {
      border: var(--border-width) solid var(--color-cream);
      background-color: var(--color-card-bg);
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: 6px 6px 0px var(--color-cream);
      position: relative;
      color: var(--color-cream);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    body.light-theme .detail-card {
      border-color: var(--color-dark);
      box-shadow: 6px 6px 0px var(--color-dark);
      color: var(--color-dark);
    }
    
    .detail-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    
    .detail-card-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.4rem;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 1px;
      line-height: 1.2;
    }
    
    .detail-meta-row {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: var(--color-gray);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    
    .detail-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
    }
    
    .detail-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      white-space: pre-line;
    }
    
    .detail-contacts {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    body.light-theme .detail-contacts {
      border-top-color: rgba(0, 0, 0, 0.1);
    }
    
    .contact-link-brutal {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--color-dark);
      background-color: var(--color-pink);
      border: 2px solid var(--color-dark);
      padding: 0.4rem 0.8rem;
      border-radius: var(--border-radius);
      text-decoration: none;
      box-shadow: 2px 2px 0px var(--color-cream);
      transition: all 0.1s;
    }
    
    body.light-theme .contact-link-brutal {
      box-shadow: 2px 2px 0px var(--color-dark);
    }
    
    .contact-link-brutal:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--color-dark);
    }
    
    .no-events-fallback {
      text-align: center;
      padding: 4rem 2rem;
      border: var(--border-width) solid var(--color-cream);
      background-color: var(--color-card-bg);
      border-radius: var(--border-radius);
      box-shadow: 6px 6px 0px var(--color-cream);
      color: var(--color-cream);
    }
    
    body.light-theme .no-events-fallback {
      border-color: var(--color-dark);
      box-shadow: 6px 6px 0px var(--color-dark);
      color: var(--color-dark);
    }
  </style>
</head>
<body>

  <!-- Background Grain Overlay -->
  <div class="grain-overlay"></div>

  <!-- HEADER / NAVBAR -->
  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="logo-wrapper">
        <div class="logo-img">
          <img src="assets/FQ_icona.ico" alt="FÔMM QUELL Logo" class="logo-svg" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <span class="logo-text">FÔMM QUELL</span>
      </a>
      <div class="header-actions" style="display: flex; align-items: center; gap: 1rem; margin-left: auto;">
        <nav class="main-nav">
          <ul>
            <li><a href="index.html#agenda" class="nav-link">Agenda</a></li>
            <li><a href="mappa.html" class="nav-link">Mappa</a></li>
            <li><a href="index.html#segnala" class="nav-link button-link">Segnala</a></li>
          </ul>
        </nav>
        <!-- Theme Toggle Button -->
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Cambia tema">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">MIDNIGHT</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN DAY VIEW -->
  <main class="day-view-container">
    
    <!-- Tre Modalità principali -->
    <div class="mode-selector-wrapper" style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap;">
      <button class="mode-btn active" id="mode-events-btn" data-mode="evento">EVENTI</button>
      <button class="mode-btn" id="mode-cinema-btn" data-mode="cinema">CINEMA</button>
      <button class="mode-btn" id="mode-theater-btn" data-mode="teatro">TEATRO</button>
    </div>

    <!-- Intestazione Giorno con Switcher -->
    <div class="day-switcher-header">
      <button id="prev-day-btn" class="day-nav-btn">← IERI</button>
      <h1 class="day-title" id="day-display-title">CARICAMENTO...</h1>
      <button id="next-day-btn" class="day-nav-btn">DOMANI →</button>
    </div>

    <!-- Lista Eventi -->
    <div class="day-events-list" id="day-events-container">
      <div style="text-align: center; padding: 3rem;">
        <p>Caricamento degli eventi del giorno in corso...</p>
        <div class="loading-spinner" style="width: 40px; height: 40px; border: 4px solid rgba(255, 46, 147, 0.2); border-top: 4px solid var(--color-pink); border-radius: 50%; margin: 10px auto; animation: spin 1s infinite linear;"></div>
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html#agenda" class="btn btn-secondary">TORNA AL CALENDARIO MENSILE</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <div class="footer-brand" style="display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1rem;">
        <img src="assets/FQ_icona.ico" alt="FÔMM QUELL Logo" style="height: 50px; width: auto;">
        <div>
          <h3 style="font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin-bottom: 0.2rem;">FÔMM QUELL</h3>
          <p>"Facciamo qualcosa" per Reggio Emilia.</p>
        </div>
      </div>
      <div class="footer-copy">
        <p>&copy; 2026 Fômm Quell. Tutti i diritti riservati.</p>
      </div>
    </div>
  </footer>

  <!-- JS Logic -->
  <script type="module" src="giorno.js?v=2.6"></script>
</body>
</html>
