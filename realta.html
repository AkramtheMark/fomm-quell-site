<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione eventi | Fômm Quell</title><link rel="stylesheet" href="portal.css?v=1"></head>
<body><main class="portal-page"><header class="portal-header"><div><a href="index.html" class="btn btn-secondary">← SITO PUBBLICO</a><h1>I MIEI<br><span class="highlight">EVENTI.</span></h1><p id="realta-name">Caricamento dell'area gestore…</p></div><button id="logout" class="portal-btn secondary">ESCI</button></header>
<p id="notice" class="portal-status" role="status"></p><div class="portal-grid"><section class="portal-card"><h2>NUOVO EVENTO</h2><form id="event-form" class="portal-form"><div><label for="titolo">Titolo *</label><input id="titolo" required maxlength="255"></div><div><label for="descrizione">Descrizione *</label><textarea id="descrizione" required></textarea></div><div><label for="data">Data *</label><input id="data" type="date" required></div><div><label for="ora">Ora di inizio</label><input id="ora" type="time"></div><div><label for="luogo">Luogo *</label><select id="luogo" required></select></div><div><label for="categoria">Categoria</label><select id="categoria"></select></div><div><label for="tags">Tag</label><input id="tags" placeholder="musica, dal vivo"></div><div><label for="contatto">Contatto / link</label><input id="contatto" placeholder="https://… oppure @profilo"></div><button class="portal-btn" type="submit">INVIA PER APPROVAZIONE</button></form></section><section class="portal-card"><h2>STATO DELLE PROPOSTE</h2><div id="events-list" class="portal-list"></div></section></div></main><script src="realta.js?v=1"></script></body></html>
